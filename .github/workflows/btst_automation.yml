name: BTST / STBT Automated Scanner & Backtest

on:
  schedule:
    # Mon-Fri at 15:15 IST (09:45 UTC) — closing window BTST/STBT scan
    - cron: '45 9 * * 1-5'
    # Friday at 17:00 IST (11:30 UTC) — weekly 10-year backtest refresh
    - cron: '30 11 * * 5'
  workflow_dispatch:
    inputs:
      run_backtest:
        description: 'Refresh 10-year backtest_results.json'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths-ignore:
      - 'reports/**'
      - 'backtest_results.json'

permissions:
  contents: write

jobs:
  btst-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh 10-year backtest (weekly / manual)
        if: github.event.schedule == '30 11 * * 5' || inputs.run_backtest == true
        run: python fetch_and_backtest.py

      - name: Run 3:15 PM BTST/STBT scanner
        run: python btst_scanner.py --save-report

      - name: Publish scan to GitHub Step Summary
        run: cat reports/latest_scan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports and backtest artifact
        uses: actions/upload-artifact@v4
        with:
          name: btst-reports-${{ github.run_number }}
          path: |
            reports/
            backtest_results.json
          retention-days: 30

      - name: Commit updated reports to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest_scan.md reports/latest_scan.json backtest_results.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(scan): automated BTST/STBT update [skip ci]"
            git push
          fi
